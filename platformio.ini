; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32@6.13.0

; Please refer here to select the partitions that can be configured.
; https://github.com/espressif/arduino-esp32/tree/master/tools/partitions
board_build.partitions = noota_3gffat.csv
board_build.filesystem = fatfs
board_build.flash_mode = qio
board_build.f_flash = 80000000L

board_build.f_cpu = 240000000L
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_raw = true
monitor_rts = 0
build_flags =
  -DUSE_ARDUINO
  -DMQTT_ENABLE=false
  -D_IR_ENABLE_DEFAULT_=false
  -DEXAMPLES_ENABLE=false
  -DMDNS_ENABLE=false
  -DUSE_DECODED_AC_SETTINGS=false
  -DDECODE_NEC=true
lib_deps = 
  Wire
  adafruit/Adafruit BusIO
  adafruit/Adafruit GFX Library
  https://github.com/deltafish32/ESP32-HUB75-MatrixPanel-DMA.git
  adafruit/Adafruit SSD1306
  https://github.com/deltafish32/IRremoteESP8266.git
  Makuna/NeoPixelBus
  rneurink/VL53L1X_ULD
  claws/BH1750
  https://github.com/adafruit/Adafruit_SHT31.git
  https://github.com/deltafish32/JPEGDEC.git
  https://github.com/deltafish32/AnimatedGIF.git
  https://github.com/jarzebski/Arduino-DS3231.git


[env:esp32dev]
board = esp32dev


[env:adafruit_matrixportal_esp32s3]
board = adafruit_matrixportal_esp32s3

; Please refer here to select the partitions that can be configured.
; https://github.com/espressif/arduino-esp32/tree/master/tools/partitions
board_build.partitions = tf_8mb.csv
board_build.arduino.memory_type = qio_qspi
board_build.psram = enabled
board_build.psram_type = qspi
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
; 보드 정의가 업로드 시 tinyuf2.bin을 0x410000에 함께 기록하는데, tf_8mb.csv에서는 이 주소가 ffat 파티션 안이므로
; FFat 데이터(볼륨 2MB 지점 이후 약 172KB)를 덮어씁니다. tf_8mb.csv에는 uf2 파티션이 없으므로 기록하지 않습니다.
; The board definition also flashes tinyuf2.bin at 0x410000 on upload. With tf_8mb.csv that address lies inside
; the ffat partition and overwrites FFat data (~172KB from the 2MB point of the volume). tf_8mb.csv has no uf2 partition, so skip it.
board_upload.arduino.flash_extra_images =
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_SERIAL_JTAG=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_JTAG_ON_BOOT=1
  -DUSE_LOCAL_ESPNOW
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DUSE_SD
  -DPIN_FSPI_CLK=13
  -DPIN_FSPI_MISO=12
  -DPIN_FSPI_MOSI=11
  -DPIN_FSPI_CS=10


; FFat 파티션을 USB 저장소로 노출하는 기능이 포함된 빌드입니다.
; USB를 TinyUSB 모드(ARDUINO_USB_MODE=0)로 사용하므로 내장 USB JTAG 디버깅은 사용할 수 없습니다.
; Build with the feature that exposes the FFat partition as USB mass storage.
; USB runs in TinyUSB mode (ARDUINO_USB_MODE=0), so the built-in USB JTAG debugging is unavailable.
[env:adafruit_matrixportal_esp32s3_usbm]
extends = env:adafruit_matrixportal_esp32s3
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DUSE_USB_MSC
  -DUSE_LOCAL_ESPNOW
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DUSE_SD
  -DPIN_FSPI_CLK=13
  -DPIN_FSPI_MISO=12
  -DPIN_FSPI_MOSI=11
  -DPIN_FSPI_CS=10

